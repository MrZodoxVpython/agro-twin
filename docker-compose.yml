services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agrotwin
    volumes: [dbdata:/var/lib/postgresql/data]   # tidak membuka port ke luar
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agro:${POSTGRES_PASSWORD}@db:5432/agrotwin
      JWT_SECRET: ${JWT_SECRET}
      ANALYTICS_URL: ${ANALYTICS_URL:-}
    depends_on: [db]
  frontend:
    build: ./frontend
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend]
volumes:
  dbdata:
